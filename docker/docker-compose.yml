version: '3.8'

services:
  php:
    build:
      context: ./php
    volumes:
      - ../:/var/www/html:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      XDEBUG_MODE: debug
      XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9003"
      DATABASE_URL: "postgresql://root:root@db:5432/api_platform?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
    depends_on:
      - db
      - redis
    networks:
      - html_network

  messenger-worker:
    build:
      context: ./php
    command: php bin/console messenger:consume async -vv
    volumes:
      - ../:/var/www/html:rw
    environment:
      DATABASE_URL: "postgresql://root:root@db:5432/api_platform?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
    depends_on:
      - db
      - redis
    networks:
      - html_network

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      db:
        condition: service_healthy
    networks:
      - html_network

  db:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d api_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: api_platform
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - html_db_data:/var/lib/postgresql/data
    networks:
      - html_network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - html_network

volumes:
  html_db_data:
    driver: local

networks:
  html_network:
    driver: bridge